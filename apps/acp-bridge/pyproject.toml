[project]
name = "paca-acp-bridge"
version = "0.1.0"
description = "Local daemon connecting an ACP-type Paca agent to a coding CLI (Claude Code, Codex, Gemini CLI, or a custom ACP server) running on your own machine."
readme = "README.md"
requires-python = ">=3.12"
# openhands-sdk is PINNED, not floated. uvx resolves this at install time on the
# box, so a floating range silently changes what every bridge runs whenever a new
# SDK is published — and this daemon depends on details the SDK does not treat as
# public API: ACPAgent's acp_resume_session_id field, the acp_session_id key in
# state.agent_state, and the _process handle its close() leaves behind. 1.47.0 is
# what the box's uv cache resolved to and what these tests were written against.
dependencies = [
    "openhands-sdk==1.47.0",
    "openhands-tools==1.47.0",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/Paca-AI/paca"
Repository = "https://github.com/Paca-AI/paca"
Issues = "https://github.com/Paca-AI/paca/issues"

[project.scripts]
paca-acp-bridge = "paca_acp_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paca_acp_bridge"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
